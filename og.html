<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cadence — OG template (1200×630)</title>
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; box-sizing: border-box;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: #ffffff; color: #101223;
    background-image: radial-gradient(60% 80% at 85% 8%, rgba(91, 91, 214, .16), transparent);
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 60px 72px;
  }
  .brand { display: flex; align-items: center; gap: 14px; font-weight: 800; font-size: 30px; letter-spacing: -.02em; }
  .mark { width: 52px; height: 52px; border-radius: 14px; background: #5b5bd6; display: flex; align-items: center; justify-content: center; }
  h1 { font-size: 62px; line-height: 1.08; letter-spacing: -.03em; margin: 0; max-width: 920px; }
  .sub { font-size: 25px; color: #5d6172; margin-top: 20px; }
  .foot { display: flex; justify-content: space-between; font-size: 19px; color: #5d6172; }
</style>
</head>
<body>
  <div class="brand">
    <span class="mark"><svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 17.5l4.5 4.5L23 11" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    Cadence
  </div>
  <div>
    <h1>Standups that take 30&nbsp;seconds,<br>not 30&nbsp;minutes.</h1>
    <div class="sub">One tidy async digest each morning. No meetings, no guilt.</div>
  </div>
  <div class="foot"><span>Showcase build</span><span>Async standups for small teams</span></div>
</body>
</html>
